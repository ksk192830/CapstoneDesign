[env:esp32-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200
extra_scripts = pre:tools/patch_esp_ipa.py
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_flags =
  -include stddef.h
  -D CAMERA_SENSOR_OV5647=1
  -D MOTOR_RUN_WHEEL_SELF_TEST=1
  -D MOTOR_SELF_TEST_SPEED=0.35f
  -D MOTOR_SELF_TEST_RUN_MS=1200
  -D MOTOR_SELF_TEST_PAUSE_MS=700
